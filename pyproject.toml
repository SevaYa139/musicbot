[project]
name = "musicbot"
version = "1.0.0"
description = "Premium Telegram bot for music and video: link in, file out"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.10",
    "yt-dlp>=2024.10",
    "curl_cffi>=0.7",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "spotipy>=2.24",
    "yandex-music>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ASYNC", "S", "B", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # asserts are fine in tests
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — не homoglyph-атака
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S108"]  # фиктивные токены/пути в тестах

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
